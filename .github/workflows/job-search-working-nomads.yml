name: "Job Search \u2014 Working Nomads"

on:
  workflow_dispatch:

concurrency:
  group: job-search-working-nomads
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run job search (Working Nomads)
        env:
          BROWSERLESS_API_KEY: ${{ secrets.BROWSERLESS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm start -- --source=working-nomads

      - name: Commit updated seen-jobs.json and runs.log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen-jobs.json runs.log
          git diff --staged --quiet || git commit -m "chore: update seen-jobs.json and runs.log [skip ci]"
          git pull --rebase origin main
          git push
