name: "Job Search \u2014 LinkedIn"

on:
  schedule:
    - cron: '32 * * * *'   # Every hour at :32
  workflow_dispatch:

concurrency:
  group: job-search-linkedin
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore LinkedIn cookies
        env:
          LINKEDIN_COOKIES: ${{ secrets.LINKEDIN_COOKIES }}
        run: |
          if [ -n "$LINKEDIN_COOKIES" ]; then
            echo "$LINKEDIN_COOKIES" > linkedin-cookies.json
          fi

      - name: Run job search (LinkedIn)
        env:
          BROWSERLESS_API_KEY: ${{ secrets.BROWSERLESS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
        run: npm start -- --source=linkedin

      - name: Commit updated seen-jobs.json and runs.log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen-jobs.json runs.log
          git diff --staged --quiet || git commit -m "chore: update seen-jobs.json and runs.log [skip ci]"
          git pull --rebase origin main
          git push
